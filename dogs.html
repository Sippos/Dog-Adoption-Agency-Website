<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Dogs - Sip Shelter</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="dogs-page">
  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">Sip Shelter</a>

      <ul class="navbar-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="dogs.html">Find a Pet</a></li>
        <li><a href="index.html#about">About Us</a></li>
        <li><a href="index.html#why-adopt">Why Adopt</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>

      <a href="index.html#contact" class="nav-button">Adopt Now</a>
    </nav>
  </header>

  <main>
    <section class="all-dogs-section">
      <div class="section-heading">
        <div>
          <h1>All Dogs</h1>
          <p>Meet all of our dogs currently waiting for a loving home.</p>
        </div>
      </div>

      <div class="dogs-grid">
        <figure class="dog-card">
          <img src="https://placedog.net/400/196?id=57" alt="Buddy, a friendly golden dog">

          <figcaption>
            <div class="dog-card-header">
              <h3>Buddy</h3>
              <span>3 years</span>
            </div>

            <p>Golden Retriever mix</p>
            <p class="dog-personality">Friendly · Playful · Loyal</p>
          </figcaption>
        </figure>

        <figure class="dog-card">
          <img src="https://placedog.net/400/194?id=73" alt="Luna, a calm beagle mix">

          <figcaption>
            <div class="dog-card-header">
              <h3>Luna</h3>
              <span>2 years</span>
            </div>

            <p>Beagle mix</p>
            <p class="dog-personality">Calm · Curious · Gentle</p>
          </figcaption>
        </figure>

        <figure class="dog-card">
          <img src="https://placedog.net/400/133?id=223" alt="Max, an energetic border collie mix">

          <figcaption>
            <div class="dog-card-header">
              <h3>Max</h3>
              <span>4 years</span>
            </div>

            <p>Border Collie mix</p>
            <p class="dog-personality">Smart · Active · Loving</p>
          </figcaption>
        </figure>

        <figure class="dog-card">
          <img src="https://placedog.net/400/278?id=218" alt="Daisy, a gentle labrador mix">

          <figcaption>
            <div class="dog-card-header">
              <h3>Daisy</h3>
              <span>1 year</span>
            </div>

            <p>Labrador mix</p>
            <p class="dog-personality">Sweet · Social · Happy</p>
          </figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2024 Dog Adoption Agency.</p>
  </footer>
</body>
</html>
